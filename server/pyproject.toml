[project]
name = "resumer-agent-api"
version = "0.1.0"
description = "Agent-oriented resume and Groq AI API for Resumer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
