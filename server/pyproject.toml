[project]
name = "resumer-agent-api"
version = "0.1.0"
description = "Agent-oriented resume and Groq AI API for Resumer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "gradio_client>=1.12,<3.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resumer_api*"]
exclude = ["supabase*"]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
