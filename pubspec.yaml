name: resumer_app
description: "Resumer — truthful resumes, tailored to every job. A mobile companion to the Resumer web platform."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  archive: ^4.0.9
  pdf: ^3.11.8
  pdfrx: 2.4.7
  printing: ^5.14.2
  supabase_flutter: ^2.9.0
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.2.0-beta.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  file_picker: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# pdfrx 2.4.7 pulls in pdfrx_engine 0.4.5, which has a known bug: a nullable
# PdfFileCache is accessed without a null-check, breaking release builds
# ("Property 'blockSize' cannot be accessed on 'PdfFileCache?'"). Fixed
# upstream in pdfrx_engine 0.4.6. Remove this override once pdfrx itself
# bumps its pdfrx_engine constraint past 0.4.5.
dependency_overrides:
  pdfrx_engine: ^0.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash-paper.png
    - assets/logos/
