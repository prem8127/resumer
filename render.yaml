services:
  - type: web
    name: resumer-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install .
    startCommand: uvicorn resumer_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        value: https://qlxijqnudiphqlbujbuj.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: VIBEVOICE_ASR_URL
        sync: false
      - key: VIBEVOICE_ASR_API_KEY
        sync: false
      - key: VIBEVOICE_ASR_TIMEOUT_SECONDS
        value: 240
      - key: RESUMER_CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-DOMAIN.vercel.app
      - key: RESUMER_CORS_ORIGIN_REGEX
        value: ""
